[project]
name = "cvss-adjuster"
version = "0.1.0"
description = "Score Paramify issues from NVD CVSS data and sync their risk-adjustment deviations"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Deliberately no private dependencies: this repo is meant to be cloned and built
# by anyone (including customers), so the Paramify API is reached through a small
# first-party httpx client in app/clients/paramify.py rather than a private SDK.
dependencies = [
    "typer>=0.12",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "import-linter>=2.0",
]
[project.scripts]
cvss-adjust = "cvss_adjuster.app.cli.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvss_adjuster"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Typer's whole API is `arg: T = typer.Option(...)` in parameter defaults — the
# intended idiom, so exempt it from B008.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["cvss_adjuster"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
